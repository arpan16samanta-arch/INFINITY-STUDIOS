<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinity Studios | Product Visuals & UGC</title>
  
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    /* --- Pure Forward Zoom Engine --- */
    body, html {
      overflow: hidden; /* Disables scroll wheels and arrow keys completely */
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: #000; /* Keeps cuts dark and cinematic */
    }

    /* Target all major page components */
    .hero-section, .about-section, .work-section, .contact-section {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      
      /* DEFAULT HIDDEN STATE: Massive, blurry, waiting out in front of the lens */
      opacity: 0;
      transform: scale(3.5); /* Massive zoom-in starting point */
      filter: blur(20px);    /* Cinematic motion blur */
      pointer-events: none;  
      
      /* Smooth, aggressive warp transition curves */
      transition: 
        transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), 
        opacity 0.4s ease-in-out, 
        filter 0.4s ease-in-out;
    }

    /* ACTIVE STATE: Perfectly focused and stable on screen */
    .hero-section.active, 
    .about-section.active, 
    .work-section.active, 
    .contact-section.active {
      opacity: 1;
      transform: scale(1);
      filter: blur(0px);
      pointer-events: auto;
      z-index: 2; /* Layered over the old exiting section */
    }

    /* EXITING STATE: Pulled deep inside the camera background */
    .hero-section.exit, 
    .about-section.exit, 
    .work-section.exit, 
    .contact-section.exit {
      opacity: 0;
      transform: scale(0.1); /* Shrinks inward into the background */
      filter: blur(15px);
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

    <div class="nav-container">
      <div class="class">

        <span>INFINITY STUDIOS</span>
      </div>
      <div class="nav-links">
        <a href="#" onclick="navigateTo('hero')">Home</a>
        <a href="#" onclick="navigateTo('about')">About</a>
        <a href="#" onclick="navigateTo('work')">Work</a>
        <a href="#" onclick="navigateTo('contact')">Contact</a>
      </div>
    </div>
  </nav>
