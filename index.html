<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinity Studios | Product Visuals & UGC</title>
  
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    /* --- Pure Forward Zoom Engine & Background Layering --- */
    body, html {
      overflow: hidden; /* Disables manual page scroll wheels globally */
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    /* Force your navigation bar to stay fixed on top of everything */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
    }

    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: #000;
    }

    /* Target all major page components */
    .hero-section, .about-section, .work-section, .contact-section {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      
      /* Strips away any solid backgrounds from style.css */
      background-color: transparent !important;
      background: none !important;
      
      /* DEFAULT HIDDEN STATE: Massive, blurry, waiting out front */
      opacity: 0;
      transform: scale(3.5); 
      filter: blur(20px);    
      pointer-events: none;  
      
      transition: 
        transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), 
        opacity 0.4s ease-in-out, 
        filter 0.4s ease-in-out;
    }

    /* WORK SECTION SPECIFIC: Disable section level scrolling to allow independent background lock */
    .work-section {
      overflow: hidden; 
    }

    /* Fixed containment: Holds background mask layer perfectly beneath text content */
    .work-scroll-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      scrollbar-width: thin;
      scroll-behavior: smooth;
      background: rgba(255, 255, 255, 0.65); /* Keeps live video visible but shifts readability up */
      z-index: 2;
    }

    /* ACTIVE STATE: Clean and stable on display */
    .hero-section.active, 
    .about-section.active, 
    .work-section.active, 
    .contact-section.active {
      opacity: 1;
      transform: scale(1);
      filter: blur(0px);
      pointer-events: auto;
      z-index: 2;
    }

    /* EXITING STATE: Zooms deeper forward into the screen background */
    .hero-section.exit, 
    .about-section.exit, 
    .work-section.exit, 
    .contact-section.exit {
      opacity: 0;
      transform: scale(0.1); 
      filter: blur(15px);
      pointer-events: none;
      z-index: 1;
    }
